# Release to Maven Central (Sonatype Portal) — tag-triggered, signed, USER_MANAGED.
#
# Triggers: pushing a version tag (e.g. 1.2.6) or manual dispatch.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CENTRAL_PORTAL_USERNAME / CENTRAL_PORTAL_PASSWORD — portal user token pair
#   ("Generate a Portal Token" under the portal username menu).
#   SIGNING_KEY                         — armored GPG private key
#   (gpg --armor --export-secret-keys KEYID). Its public half must be on a
#   keyserver (gpg --keyserver keyserver.ubuntu.com --send-keys KEYID).
#   SIGNING_PASSWORD                    — passphrase of that GPG key.
# After validation passes, press Publish on the deployment card in the portal.
# Note: this library consumes io.github.mokhtarabadi:parse from Central, so the
# SDK release must be published first or dependency resolution fails here.

name: release-central
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
jobs:
  publish-central:
    name: Publish to Central Portal
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Setup Gradle Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
      - name: Setup Gradle Wrapper Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(grep 'versionName "' ParseLiveQuery/build.gradle | head -1 | cut -d'"' -f2)"
          echo "tag=$TAG version=$VERSION"
          test "$TAG" = "$VERSION" || { echo "Tag $TAG does not match versionName $VERSION"; exit 1; }
      - name: Build signed Central bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/central-init.gradle" <<'EOF'
          allprojects {
              plugins.withId('maven-publish') {
                  publishing {
                      repositories {
                          maven {
                              name = 'centralBundle'
                              url = uri(System.getenv('CENTRAL_BUNDLE_DIR'))
                          }
                      }
                  }
              }
          }
          EOF
          export CENTRAL_BUNDLE_DIR="$RUNNER_TEMP/central-bundle"
          mkdir -p "$CENTRAL_BUNDLE_DIR"
          ./gradlew publishAllPublicationsToCentralBundleRepository \
            -I "$RUNNER_TEMP/central-init.gradle" \
            -PcentralGroup=io.github.mokhtarabadi --no-daemon
      - name: Zip bundle and upload to Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          cd "$RUNNER_TEMP/central-bundle"
          zip -qr "$RUNNER_TEMP/central-bundle.zip" io
          BEARER="$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 -w0)"
          DEPLOYMENT_ID="$(curl -sS -H "Authorization: Bearer $BEARER" \
            -F "bundle=@$RUNNER_TEMP/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED")"
          echo "deploymentId=$DEPLOYMENT_ID"
          echo "$DEPLOYMENT_ID" > "$RUNNER_TEMP/deployment-id.txt"
          for i in $(seq 1 20); do
            sleep 30
            STATE="$(curl -sS -H "Authorization: Bearer $BEARER" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState", "UNKNOWN"))')"
            echo "attempt $i: $STATE"
            if [ "$STATE" = "VALIDATED" ] || [ "$STATE" = "PUBLISHED" ]; then
              echo "Portal accepted the bundle (state=$STATE). Press Publish on the deployment card."
              exit 0
            fi
            if [ "$STATE" = "FAILED" ]; then
              echo "Portal validation FAILED — see the deployment card for details."
              exit 1
            fi
          done
          echo "Timed out waiting for validation; check the deployment card in the portal."
          exit 1
