plugins {
    id "com.diffplug.spotless" version "8.10.4"
}

apply plugin: "com.android.library"

android {
    compileSdk 36
    namespace "com.parse.livequery"

    defaultConfig {
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.2.5"
        consumerProguardFiles "release-proguard.pro"
    }

    buildFeatures {
        buildConfig = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    lint {
        abortOnError false
    }

    buildTypes {
        debug {
            enableAndroidTestCoverage = true
            enableUnitTestCoverage = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api "io.github.mokhtarabadi:parse:4.4.5"
    api "com.squareup.okhttp3:okhttp:5.4.0"

    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "org.skyscreamer:jsonassert:1.5.3"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.24.0"
}

spotless {
    // Only enforce formatting on files changed vs upstream; keeps history untouched.
    ratchetFrom 'origin/master'
    java {
        googleJavaFormat()
    }
}

// JitPack publishes via: ./gradlew clean -Pgroup=... -Pversion=... -xtest -xlint publishToMavenLocal
apply plugin: "maven-publish"

group = findProperty("centralGroup") ?: findProperty("group") ?: "com.github.mokhtarabadi"
version = findProperty("centralVersion") ?: "1.2.5"

base {
    archivesName = "ParseLiveQuery-Android"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components["release"]
                artifactId = "ParseLiveQuery-Android"
                pom {
                    name = "ParseLiveQuery-Android"
                    description = "Parse LiveQuery client for Android"
                    url = "https://github.com/mokhtarabadi/ParseLiveQuery-Android"
                    licenses {
                        license {
                            name = "BSD License"
                            url = "https://github.com/mokhtarabadi/ParseLiveQuery-Android/blob/master/LICENSE"
                        }
                    }
                    developers {
                        developer {
                            id = "mokhtarabadi"
                            name = "Mohammad Reza Mokhtarabadi"
                        }
                    }
                    scm {
                        connection = "scm:git:git://github.com/mokhtarabadi/ParseLiveQuery-Android.git"
                        developerConnection = "scm:git:ssh://github.com/mokhtarabadi/ParseLiveQuery-Android.git"
                        url = "https://github.com/mokhtarabadi/ParseLiveQuery-Android"
                    }
                }
            }
        }
    }
}
