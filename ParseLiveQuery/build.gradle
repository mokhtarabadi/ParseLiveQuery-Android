plugins {
    id "com.diffplug.spotless" version "8.10.4"
}

apply plugin: "com.android.library"

android {
    compileSdk 36
    namespace "com.parse.livequery"

    defaultConfig {
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        consumerProguardFiles "release-proguard.pro"
    }

    buildFeatures {
        buildConfig = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    lint {
        abortOnError false
    }

    buildTypes {
        debug {
            enableAndroidTestCoverage = true
            enableUnitTestCoverage = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api "com.github.parse-community.Parse-SDK-Android:parse:4.4.0"
    api "com.squareup.okhttp3:okhttp:5.4.0"

    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "org.skyscreamer:jsonassert:1.5.3"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.24.0"
}

spotless {
    // Only enforce formatting on files changed vs upstream; keeps history untouched.
    ratchetFrom 'origin/master'
    java {
        googleJavaFormat()
    }
}

// JitPack publishes via: ./gradlew clean -Pgroup=... -Pversion=... -xtest -xlint publishToMavenLocal
apply plugin: "maven-publish"

group = findProperty("group") ?: "com.github.mokhtarabadi"

base {
    archivesName = "ParseLiveQuery-Android"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components["release"]
                artifactId = "ParseLiveQuery-Android"
            }
        }
    }
}
