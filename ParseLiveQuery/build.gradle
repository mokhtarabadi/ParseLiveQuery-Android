plugins {
    id "com.diffplug.spotless" version "8.10.4"
}

apply plugin: "com.android.library"

android {
    compileSdk 35
    namespace "com.parse.livequery"

    defaultConfig {
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        consumerProguardFiles "release-proguard.pro"
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        abortOnError false
    }

    buildTypes {
        debug {
            enableAndroidTestCoverage = true
            enableUnitTestCoverage = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api "com.github.parse-community.Parse-SDK-Android:parse:4.4.0"
    api "com.squareup.okhttp3:okhttp:5.4.0"

    testImplementation "org.robolectric:robolectric:4.7"
    testImplementation "org.skyscreamer:jsonassert:1.5.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:4.6.1"
}

spotless {
    // Only enforce formatting on files changed vs upstream; keeps history untouched.
    ratchetFrom 'origin/master'
    java {
        googleJavaFormat()
    }
}
